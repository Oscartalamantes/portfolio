<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>West Valley Auto - Booking Demo | Oscar Talamantes</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family: Inter, system-ui, sans-serif}</style></head>
<body class="bg-zinc-50 text-zinc-900">
<div class="max-w-3xl mx-auto p-6 md:p-10">
  <div class="bg-white rounded-3xl shadow-sm border p-8">
    <div class="flex justify-between items-start mb-6"><div><h1 class="text-2xl font-bold">West Valley Auto — Book Service</h1><p class="text-sm text-zinc-500 mt-1">Demo for portfolio — no backend, shows flow clients pay for</p></div><span class="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full">Live Demo</span></div>
    <div class="grid md:grid-cols-2 gap-6">
      <div><label class="text-sm font-medium">Service</label><select id="service" class="mt-1 w-full border rounded-xl p-3"><option>Oil Change — $49</option><option>Brake Check — Free</option><option>Full Inspection — $99</option><option>Tire Rotation — $35</option></select></div>
      <div><label class="text-sm font-medium">Date</label><input id="date" type="date" class="mt-1 w-full border rounded-xl p-3"></div>
      <div><label class="text-sm font-medium">Name</label><input id="name" placeholder="Your name" class="mt-1 w-full border rounded-xl p-3"></div>
      <div><label class="text-sm font-medium">Phone</label><input id="phone" placeholder="801-..." class="mt-1 w-full border rounded-xl p-3"></div>
    </div>
    <div class="mt-6"><label class="text-sm font-medium">Vehicle</label><input id="vehicle" placeholder="2016 Harley / Toyota Camry etc" class="mt-1 w-full border rounded-xl p-3"></div>
    <button id="bookBtn" class="mt-6 w-full bg-black text-white rounded-full py-3 font-semibold hover:bg-zinc-800">Confirm Booking — Get SMS Confirmation</button>
    <div id="result" class="mt-4 hidden p-4 bg-green-50 border border-green-200 rounded-xl text-sm"></div>
    <div class="mt-8 pt-6 border-t text-xs text-zinc-500">Stack: HTML, Vanilla JS, Calendly-style UX • Conversion: old site had phone-only, this adds 24/7 booking. <br>Code is clean, mobile responsive, validates phone/date.</div>
  </div>
</div>
<script>
const btn=document.getElementById('bookBtn'), res=document.getElementById('result');
btn.addEventListener('click',()=>{
  const name=document.getElementById('name').value.trim(), phone=document.getElementById('phone').value.trim(), date=document.getElementById('date').value, service=document.getElementById('service').value;
  if(!name||!phone||!date){res.classList.remove('hidden');res.className='mt-4 p-4 bg-red-50 border border-red-200 rounded-xl text-sm';res.textContent='Please fill name, phone, date.';return;}
  res.classList.remove('hidden');res.className='mt-4 p-4 bg-green-50 border border-green-200 rounded-xl text-sm';
  res.innerHTML=`<b>Booked!</b> ${service} on ${date} for ${name}. Confirmation SMS will be sent to ${phone}. <br><span class='text-zinc-500'>This demo uses no backend — in production I'd hook Twilio + Google Calendar.</span>`;
  btn.textContent='Booked ✓';
});
document.getElementById('date').minAsDate=new Date().toISOString().split('T')[0]; document.getElementById('date').min=new Date().toISOString().split('T')[0];
</script>
</body></html>
