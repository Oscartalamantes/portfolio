<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini CRM Dashboard Demo | Oscar Talamantes</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-zinc-50 p-6">
<div class="max-w-5xl mx-auto">
  <div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-bold">Mini CRM — Clients</h1><div class="flex gap-2"><input id="search" placeholder="Search name, phone..." class="border rounded-full px-4 py-2 text-sm w-56"><button id="addBtn" class="bg-black text-white rounded-full px-4 py-2 text-sm font-semibold">+ Add Client</button></div></div>
  <div class="bg-white rounded-2xl border shadow-sm overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-zinc-50 text-zinc-500 text-xs"><tr><th class="text-left p-3">Name</th><th class="text-left p-3">Phone</th><th class="text-left p-3">Service</th><th class="text-left p-3">Status</th><th class="text-left p-3">Action</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
  <div class="mt-4 text-xs text-zinc-500">Stack: Vanilla JS, Tailwind, localStorage CRUD, search/filter, CSV export. No backend — data persists in browser. This is what small shops actually pay $200-400 for instead of Excel.</div>
</div>
<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h2 class="font-bold mb-3">Add / Edit Client</h2><input id="fName" placeholder="Name" class="w-full border rounded-xl p-2 mb-2"><input id="fPhone" placeholder="Phone" class="w-full border rounded-xl p-2 mb-2"><select id="fService" class="w-full border rounded-xl p-2 mb-2"><option>Oil Change</option><option>Brake Check</option><option>Tacos Catering</option><option>Website Fix</option></select><select id="fStatus" class="w-full border rounded-xl p-2 mb-3"><option>New</option><option>Booked</option><option>Done</option></select><div class="flex gap-2"><button id="save" class="flex-1 bg-black text-white rounded-full py-2 text-sm">Save</button><button id="cancel" class="flex-1 border rounded-full py-2 text-sm">Cancel</button></div></div></div>
<script>
let data=JSON.parse(localStorage.getItem('oscar_crm')||'[{"id":1,"name":"Mike D.","phone":"801-555-0123","service":"Oil Change","status":"Booked"},{"id":2,"name":"Sofia R.","phone":"801-555-0456","service":"Website Fix","status":"New"}]');
let editing=null;
const tbody=document.getElementById('tbody'), search=document.getElementById('search'), modal=document.getElementById('modal');
function saveStore(){localStorage.setItem('oscar_crm',JSON.stringify(data));}
function render(){const q=search.value.toLowerCase();tbody.innerHTML='';data.filter(d=>!q||d.name.toLowerCase().includes(q)||d.phone.includes(q)).forEach(r=>{const tr=document.createElement('tr');tr.className='border-t hover:bg-zinc-50';tr.innerHTML=`<td class='p-3 font-medium'>${r.name}</td><td class='p-3'>${r.phone}</td><td class='p-3'>${r.service}</td><td class='p-3'><span class='px-2 py-1 rounded-full text-xs ${r.status==='Done'?'bg-green-100 text-green-700':r.status==='Booked'?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700'}'>${r.status}</span></td><td class='p-3'><button onclick='edit(${r.id})' class='text-xs underline'>Edit</button> <button onclick='del(${r.id})' class='text-xs underline text-red-600 ml-2'>Delete</button></td>`;tbody.appendChild(tr);});}
function openModal(){modal.classList.remove('hidden');modal.classList.add('flex');}
function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex');editing=null;document.getElementById('fName').value='';document.getElementById('fPhone').value='';}
document.getElementById('addBtn').addEventListener('click',()=>{editing=null;openModal();});
document.getElementById('cancel').addEventListener('click',closeModal);
document.getElementById('save').addEventListener('click',()=>{const name=document.getElementById('fName').value.trim(), phone=document.getElementById('fPhone').value.trim();if(!name)return alert('Name required');const rec={id:editing||Date.now(),name,phone,service:document.getElementById('fService').value,status:document.getElementById('fStatus').value};if(editing){const idx=data.findIndex(d=>d.id===editing);data[idx]=rec;}else data.unshift(rec);saveStore();render();closeModal();});
window.edit=(id)=>{const r=data.find(d=>d.id===id);editing=id;document.getElementById('fName').value=r.name;document.getElementById('fPhone').value=r.phone;document.getElementById('fService').value=r.service;document.getElementById('fStatus').value=r.status;openModal();};
window.del=(id)=>{if(confirm('Delete?')){data=data.filter(d=>d.id!==id);saveStore();render();}};
search.addEventListener('input',render);render();
</script>
</body></html>
